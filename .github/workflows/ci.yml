name: AeroVault Analytics CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Run pytest inside the airflow container
        env:
          POSTGRES_DB: aerovault_test
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: testpassword
          API_NINJAS_KEY: dummy_ci_key
          API_OPENSKY_KEY: dummy_opensky_key
          AIRFLOW_USER: admin
          AIRFLOW_PASSWORD: admin

        run: docker compose run --rm --entrypoint bash airflow -c "pip install --quiet pytest && pytest /opt/airflow/tests"

      - name: Tear down containers
        if: always()
        run: docker compose down -v

  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          include-prerelease: true

      - name: Build .NET Web API
        run: dotnet build ./api/AeroVault.API.csproj --configuration Release
      
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck & build frontend
        run: npm run build