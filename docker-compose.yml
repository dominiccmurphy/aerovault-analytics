services:
  postgres_target:
      image: postgres:15
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
      volumes:
        - ./sql:/docker-entrypoint-initdb.d
      ports:
        - "5433:5432"

  airflow:
    image: apache/airflow:2.10.4
    depends_on:
      postgres_target:
        condition: service_healthy
    environment:
      - PYTHONPATH=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - API_NINJAS_KEY=${API_NINJAS_KEY}
      - API_OPENSKY_KEY=${API_OPENSKY_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USER}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./include:/opt/airflow/include
      - ./tests:/opt/airflow/tests
    ports:
      - "8080:8080"
    command: standalone

  web_api:
    build: ./api
    container_name: aerovault_web_api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres_target;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      - postgres_target
  
  frontend:
    build: ./frontend
    container_name: aerovault_frontend
    ports:
      - "3000:80"
    depends_on:
      - web_api